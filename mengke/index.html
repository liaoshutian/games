<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#291056">
<title>星光萌可捕捉游戏</title>
<style>
:root{--pink:#ff70d0;--gold:#ffd76b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#100426;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}
button{font:inherit;border:0;color:inherit;cursor:pointer}button:focus-visible{outline:5px solid #fff;outline-offset:4px}
.game{position:relative;width:100vw;height:100dvh;min-height:420px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 65%,#d659ff55,transparent 32%),radial-gradient(circle at 18% 16%,#5e8fff66,transparent 27%),linear-gradient(160deg,#30126b,#180a45 55%,#0b082f)}
.game:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 38% 68%,#d8b7ff 0 1px,transparent 2px),radial-gradient(circle at 84% 76%,#fff 0 1.5px,transparent 2.5px);background-size:140px 120px,190px 170px,210px 180px,250px 220px;opacity:.8;animation:drift 18s linear infinite;z-index:-2}
.game:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-26%;height:50%;border-radius:50% 50% 0 0;background:linear-gradient(#7d40d8,#2b155f 65%);box-shadow:0 -18px 80px #e081ff55;z-index:-1}
.aurora{position:absolute;inset:-25%;background:conic-gradient(from 30deg at 50% 50%,transparent,#c36cff28,transparent,#74b9ff25,transparent);filter:blur(26px);animation:spin 24s linear infinite;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:scale(.98);transition:.45s ease}.screen.active{opacity:1;visibility:visible;transform:scale(1)}
.hud{position:absolute;z-index:30;top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.roster{display:flex;gap:9px;padding:8px 11px;border:2px solid #ffffff55;border-radius:999px;background:#1c094599;box-shadow:0 10px 35px #09021e55,inset 0 1px #ffffff55;backdrop-filter:blur(10px);pointer-events:auto}
.slot{position:relative;width:60px;height:60px;padding:3px;border-radius:50%;background:linear-gradient(145deg,#fff,#ccb3ff);box-shadow:0 5px 0 #5b2a9c,0 0 16px #d86dff55}.slot img{width:100%;height:100%;object-fit:contain;border-radius:50%;background:linear-gradient(#a976ff,#5331a8)}.slot.locked{background:#29124f;box-shadow:0 4px 0 #0f0721}.slot.locked img{filter:brightness(0)!important;opacity:.32}.slot.locked:after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:24px}.crown{position:absolute;top:-13px;left:50%;font-size:22px;transform:translateX(-50%) rotate(-5deg);filter:drop-shadow(0 2px 2px #6c3500)}
.icon-btn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffffff88,#8a55dd99);border:2px solid #ffffff77;box-shadow:0 6px 0 #3b1c75;font-size:28px;pointer-events:auto}
.intro-inner,.finale-inner{position:relative;width:min(94vw,780px);height:min(88vh,660px);display:flex;flex-direction:column;align-items:center;justify-content:center}.moon{position:absolute;top:4%;width:min(42vw,330px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff,#f0ceff 30%,#c283ff 68%,#7e46d9);box-shadow:0 0 40px #fff,0 0 100px #bd73ff;opacity:.92}.music-ring{position:absolute;width:min(76vw,600px);aspect-ratio:1;border-radius:50%;border:3px dashed #e7c8ff88;animation:spin 18s linear infinite;box-shadow:inset 0 0 60px #8b52ff33}.music-ring:before,.music-ring:after{position:absolute;font-size:50px;filter:drop-shadow(0 0 12px #fff)}.music-ring:before{content:"♪";top:8%;left:4%;color:#ff9bdd}.music-ring:after{content:"♫";right:0;bottom:18%;color:#8ed7ff}
.intro-art{position:relative;height:min(52vh,440px);max-width:68vw;object-fit:contain;filter:drop-shadow(0 18px 22px #0b021e80);animation:float 2.6s ease-in-out infinite;z-index:2}.play-btn,.next-btn{position:relative;z-index:4;width:116px;height:116px;border-radius:50%;display:grid;place-items:center;padding-left:9px;font-size:58px;color:#fff;background:linear-gradient(145deg,#ff8dda,#a34fff);border:5px solid #ffe9ff;box-shadow:0 10px 0 #5c248e,0 0 0 9px #ffffff28,0 0 45px #ff77df;animation:pulse 1.7s ease-in-out infinite}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:92px 12px 130px}.stage-halo{position:absolute;width:min(70vw,600px);height:min(52vh,440px);border-radius:50%;background:radial-gradient(ellipse,#d28aff66,transparent 68%);filter:blur(4px)}.character{position:relative;z-index:4;height:min(57vh,490px);max-width:72vw;object-fit:contain;filter:drop-shadow(0 22px 26px #08001c99);user-select:none;-webkit-user-drag:none;transition:.35s ease}.mischief{cursor:pointer;animation:wiggle 1.2s ease-in-out infinite}.mischief.spotted{animation:bounce .55s ease 1}.princess{display:none;height:min(68vh,580px);animation:arrive .9s cubic-bezier(.1,.8,.2,1)}.princess.show{display:block}
.note{position:absolute;font-size:clamp(36px,6vw,66px);z-index:3;animation:noteFly 3s ease-in infinite;filter:drop-shadow(0 0 10px currentColor)}.note.n1{left:18%;top:27%;color:#ff8ed8}.note.n2{right:18%;top:23%;color:#8fd8ff;animation-delay:-1.5s}.note.n3{left:27%;bottom:23%;color:#ffe077;animation-delay:-2.2s}.note.n4{right:27%;bottom:25%;color:#db9aff;animation-delay:-.2s}.tap-hint{position:absolute;z-index:8;bottom:14%;font-size:58px;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 5px 4px #220845)}
.select-card{display:none;position:absolute;z-index:12;left:50%;bottom:8%;transform:translateX(-50%);width:142px;height:142px;border-radius:42px;background:linear-gradient(145deg,#ffffffcc,#9c5bdfdd);border:5px solid #ffe8ff;box-shadow:0 10px 0 #522486,0 0 40px #ff72da;animation:pulse 1.5s infinite}.select-card.show{display:block}.select-card img{width:100%;height:100%;object-fit:contain}.select-card .crown{font-size:38px;top:-24px}.fusion-burst{display:none;position:absolute;z-index:2;width:min(85vmin,650px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(#fff 0 3deg,transparent 3deg 12deg);mask-image:radial-gradient(circle,transparent 0 18%,#000 46%,transparent 72%);animation:spin 7s linear infinite;opacity:.8}.fusion-burst.show{display:block}
.rhythm{position:absolute;z-index:20;bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;gap:18px;align-items:flex-end}.rhythm.show{display:flex}.pad{width:clamp(100px,17vw,150px);height:clamp(88px,13vw,116px);border-radius:50% 50% 42% 42%;font-size:clamp(42px,7vw,68px);font-weight:900;color:#fff;text-shadow:0 4px 0 #0004;border:5px solid #ffffff99;box-shadow:0 10px 0 #35106a,0 0 28px currentColor;transition:.12s ease}.pad:nth-child(1){background:linear-gradient(#65d9ff,#3180ef)}.pad:nth-child(2){background:linear-gradient(#ff8cdc,#d64cbc)}.pad:nth-child(3){background:linear-gradient(#ffd96b,#f19b32)}.pad.flash{transform:translateY(-18px) scale(1.1);filter:brightness(1.55);box-shadow:0 10px 0 #35106a,0 0 70px #fff}.pad:disabled{cursor:default}
.sequence-orbit{position:absolute;z-index:8;top:16%;left:50%;transform:translateX(-50%);display:none;gap:14px}.sequence-orbit.show{display:flex}.sequence-dot{width:24px;height:24px;border-radius:50%;background:#ffffff33;border:3px solid #ffffff88}.sequence-dot.done{background:#ffe379;box-shadow:0 0 18px #fff}
.capture{position:absolute;inset:0;z-index:22;display:none;align-items:center;justify-content:center}.capture.show{display:flex}.bubble{position:relative;width:min(58vw,450px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 33% 25%,#fff 0 3%,#ffffff55 5%,transparent 22%),linear-gradient(145deg,#eebcff44,#78bcff25);border:6px solid #fbe7ffcc;box-shadow:inset -30px -38px 55px #7d35bb55,inset 24px 20px 45px #ffffff77,0 0 35px #fff,0 0 100px #b05dff;transition:.2s;animation:bob 1.8s ease-in-out infinite}.bubble img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 14px 14px #37116b88)}.bubble-hit{position:absolute;font-size:46px;animation:pop .55s ease forwards;pointer-events:none}.capture-stars{position:absolute;top:10%;left:50%;transform:translateX(-50%);display:flex;gap:20px;font-size:46px}.capture-stars span{opacity:.22;filter:grayscale(1)}.capture-stars span.on{opacity:1;filter:none;animation:pop .45s ease;color:#ffe375;text-shadow:0 0 18px #fff}
.reward{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column}.reward.show{display:flex}.reward .character{height:min(50vh,400px);animation:reward .9s cubic-bezier(.1,.9,.2,1)}.reward-crown{font-size:clamp(75px,13vw,125px);margin-bottom:-60px;z-index:8;filter:drop-shadow(0 8px 4px #8c4800);animation:crownDrop .8s cubic-bezier(.1,.9,.2,1)}.reward .next-btn{width:98px;height:98px;font-size:46px;margin-top:-12px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50}.confetti i{position:absolute;top:-10%;font-style:normal;font-size:26px;animation:fall var(--d) linear forwards;left:var(--x)}.finale-line{display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,2vw,18px);z-index:3;margin-bottom:18px}.finale-line img{width:min(22vw,160px);height:min(25vh,200px);object-fit:contain;filter:drop-shadow(0 13px 12px #13042c)}.finale-line img:nth-child(2){transform:scale(1.17);z-index:2}.finale-stars{z-index:3;font-size:clamp(44px,8vw,82px);letter-spacing:12px;color:#ffe67e;text-shadow:0 0 22px #fff;animation:pulse 1.5s infinite}.shake{animation:shake .35s ease}.hidden{display:none!important}
@keyframes drift{to{background-position:140px 120px,-190px 170px,210px -180px,-250px -220px}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-16px) rotate(2deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.12)}}@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg) translateY(-13px)}}@keyframes bounce{40%{transform:scale(.86) translateY(18px)}70%{transform:scale(1.15) translateY(-22px)}}@keyframes noteFly{0%{transform:translateY(30px) rotate(-12deg);opacity:0}20%,75%{opacity:1}100%{transform:translateY(-90px) rotate(18deg);opacity:0}}@keyframes tap{50%{transform:translateY(-13px) scale(.92)}}@keyframes arrive{0%{transform:scale(.15) rotate(-18deg);opacity:0}70%{transform:scale(1.08) rotate(3deg)}}@keyframes bob{50%{transform:translateY(-12px) scale(1.02)}}@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.4);opacity:1}100%{transform:scale(1.8);opacity:0}}@keyframes reward{0%{transform:scale(.1) rotate(-22deg)}70%{transform:scale(1.18) rotate(4deg)}}@keyframes crownDrop{0%{transform:translateY(-60vh) rotate(-25deg)}75%{transform:translateY(12px) rotate(7deg)}}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}@keyframes shake{25%{transform:translateX(-16px)}50%{transform:translateX(14px)}75%{transform:translateX(-8px)}}
@media(max-aspect-ratio:4/5){.scene{padding-top:125px;padding-bottom:185px}.character{height:min(47vh,430px);max-width:90vw}.princess{height:min(55vh,510px)}.roster{gap:5px;padding:7px}.slot{width:50px;height:50px}.rhythm{bottom:max(48px,env(safe-area-inset-bottom));gap:10px}.pad{width:29vw;height:23vw}.tap-hint{bottom:20%}.select-card{bottom:13%}.intro-art{height:48vh;max-width:85vw}.bubble{width:min(78vw,450px)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

let level=0,input=0,hits=0,muted=false,locked=false,audio=null,unlocked=Math.max(1,Math.min(4,Number(localStorage.getItem('starlightRoyal')||1)));
function tone(n,d=.18){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=[0,523.25,659.25,783.99][n]||880;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.18,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d+.03)}catch(e){}}
function renderRoster(){const f=['none','none','hue-rotate(38deg) saturate(1.15)','hue-rotate(295deg) brightness(1.12)'];$('#roster').innerHTML=[0,1,2,3].map(i=>`<div class="slot ${i<unlocked?'':'locked'}"><img alt="" src="${i?sourceSong:sourceHeart}" style="filter:${f[i]}">${i<unlocked?'<span class="crown">♛</span>':''}</div>`).join('')}
function setScreen(el){$$('.screen').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function begin(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();tone(1);hud.classList.remove('hidden');setScreen(playScreen);level=Math.min(2,Math.max(0,unlocked-1));startLevel()}
function resetStage(){locked=false;input=hits=0;rhythm.classList.remove('show');orbit.classList.remove('show');capture.classList.remove('show');reward.classList.remove('show');choice.classList.remove('show');princess.classList.remove('show','hidden');burst.classList.remove('show');mischief.classList.remove('hidden','spotted');tapHint.classList.remove('hidden');mischief.style.filter=levels[level].filter;$$('#capture img,#reward img').forEach(x=>x.style.filter=levels[level].filter);$$('#captureStars span').forEach(x=>x.classList.remove('on'));bubble.style.transform='';bubble.style.opacity='1'}
function startLevel(){resetStage();renderRoster();setTimeout(()=>tone(level%3+1),250)}
function spotted(){if(locked)return;locked=true;tone(3);mischief.classList.add('spotted');tapHint.classList.add('hidden');setTimeout(()=>{choice.classList.add('show');locked=false},520)}
function fuse(){if(locked)return;locked=true;tone(1,.3);choice.classList.remove('show');mischief.classList.add('hidden');burst.classList.add('show');setTimeout(()=>{princess.classList.add('show');tone(2,.3)},300);setTimeout(()=>{tone(3,.45);beginRhythm()},1500)}
function beginRhythm(){burst.classList.remove('show');orbit.innerHTML=levels[level].seq.map(()=>'<i class="sequence-dot"></i>').join('');orbit.classList.add('show');rhythm.classList.add('show');$$('.pad').forEach(b=>b.disabled=true);playSequence()}
async function playSequence(){locked=true;input=0;$$('.sequence-dot').forEach(x=>x.classList.remove('done'));await wait(420);for(const n of levels[level].seq){flash(n);await wait(620)}locked=false;$$('.pad').forEach(b=>b.disabled=false)}
function flash(n){const p=$(`.pad[data-pad="${n}"]`);p.classList.add('flash');tone(n);setTimeout(()=>p.classList.remove('flash'),330)}
function press(n){if(locked)return;flash(n);const seq=levels[level].seq;if(n===seq[input]){$$('.sequence-dot')[input].classList.add('done');if(++input===seq.length){locked=true;$$('.pad').forEach(b=>b.disabled=true);tone(3,.45);setTimeout(beginCapture,650)}}else{locked=true;game.classList.add('shake');tone(1,.08);setTimeout(()=>{game.classList.remove('shake');playSequence()},650)}}
function beginCapture(){rhythm.classList.remove('show');orbit.classList.remove('show');princess.classList.add('hidden');capture.classList.add('show');locked=false;hits=0}
function hitBubble(e){if(locked)return;hits++;tone(hits);$$('#captureStars span')[hits-1].classList.add('on');bubble.style.transform=`scale(${1-hits*.08})`;const spark=document.createElement('i');spark.className='bubble-hit';spark.textContent='★';spark.style.left=(e.offsetX||bubble.clientWidth/2)+'px';spark.style.top=(e.offsetY||bubble.clientHeight/2)+'px';bubble.appendChild(spark);setTimeout(()=>spark.remove(),600);if(hits>=3){locked=true;bubble.style.opacity='0';setTimeout(showReward,520)}}
function showReward(){capture.classList.remove('show');reward.classList.add('show');unlocked=Math.max(unlocked,Math.min(4,level+2));localStorage.setItem('starlightRoyal',String(unlocked));renderRoster();confetti(32);tone(3,.7);locked=false}
function nextLevel(){if(locked)return;if(level<2){level++;startLevel()}else showFinale()}
function showFinale(){hud.classList.add('hidden');setScreen(finale);confetti(55);[1,2,3].forEach((n,i)=>setTimeout(()=>tone(n,.5),i*220))}
function confetti(count){const box=$('#confetti');box.innerHTML='';const shapes=['★','♥','♪','◆'];for(let i=0;i<count;i++){const p=document.createElement('i');p.textContent=shapes[i%4];p.style.setProperty('--x',Math.random()*100+'%');p.style.setProperty('--d',2.6+Math.random()*2.4+'s');p.style.color=['#ffe16d','#ff85d7','#8bd8ff','#d6a2ff'][i%4];p.style.animationDelay=Math.random()*.7+'s';box.appendChild(p)}setTimeout(()=>box.innerHTML='',5600)}
function again(){unlocked=1;localStorage.setItem('starlightRoyal','1');level=0;hud.classList.remove('hidden');setScreen(playScreen);startLevel()}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
$('#play').addEventListener('click',begin);mischief.addEventListener('click',spotted);choice.addEventListener('click',fuse);$$('.pad').forEach(b=>b.addEventListener('click',()=>press(Number(b.dataset.pad))));bubble.addEventListener('click',hitBubble);$('#next').addEventListener('click',nextLevel);$('#again').addEventListener('click',again);$('#sound').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';if(!muted)tone(2)});renderRoster();document.addEventListener('contextmenu',e=>e.preventDefault());
})();
