<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#19082f">
<title>星光萌可捕捉游戏</title>
<style>
:root{--pink:#ff6fcf;--violet:#8d55ff;--blue:#6fdfff;--gold:#ffe176;--ink:#160730}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#100323;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}
button{font:inherit;border:0;color:inherit;cursor:pointer}button:focus-visible{outline:5px solid #fff;outline-offset:4px}
.game{position:relative;width:100vw;height:100dvh;min-height:520px;overflow:hidden;isolation:isolate;color:#fff;background:radial-gradient(circle at 50% 54%,#6f39b988,transparent 36%),radial-gradient(circle at 12% 18%,#315bc955,transparent 30%),linear-gradient(155deg,#351070,#180740 57%,#090a2d)}
.game:before{content:"";position:absolute;inset:0;z-index:-3;background:radial-gradient(circle,#fff 0 1.2px,transparent 2px);background-size:58px 58px;opacity:.5;animation:stars 20s linear infinite}
.game:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-28%;height:54%;z-index:-2;border-radius:50% 50% 0 0;background:linear-gradient(#6f35c9,#22104d 68%);box-shadow:0 -18px 75px #bd6dff55}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:scale(.98);transition:.45s ease}.screen.active{opacity:1;visibility:visible;transform:scale(1)}
.intro-box{position:relative;width:min(92vw,780px);height:min(90vh,680px);display:flex;align-items:center;justify-content:center}.intro-moon{position:absolute;width:min(66vmin,520px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 31%,#fff,#e8cbff 30%,#b278ef 70%,#6433ba);box-shadow:0 0 38px #fff,0 0 120px #b95fff}.intro-orbit{position:absolute;width:min(80vmin,650px);aspect-ratio:1;border:4px dashed #ffffff66;border-radius:50%;animation:spin 18s linear infinite}.intro-art{position:absolute;display:flex;align-items:flex-end;justify-content:center;gap:min(18vw,140px);bottom:19%}.intro-art img{width:min(33vw,260px);height:min(47vh,380px);object-fit:contain;filter:drop-shadow(0 20px 20px #100022aa);animation:float 2.6s ease-in-out infinite}.intro-art img:last-child{animation-delay:-1.3s}
.play-btn{position:absolute;bottom:3%;width:122px;height:122px;border-radius:50%;display:grid;place-items:center;padding-left:8px;color:#fff;font-size:60px;background:linear-gradient(145deg,#ff8edb,#9d4aff);border:6px solid #ffeaff;box-shadow:0 11px 0 #542183,0 0 0 9px #ffffff2b,0 0 48px #f576da;animation:pulse 1.6s ease-in-out infinite}
.hud{position:absolute;z-index:45;top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;pointer-events:none}.counter{min-width:86px;height:58px;padding:7px 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;background:#18083dbb;border:2px solid #ffffff55;box-shadow:0 8px 24px #05000e88;font-size:30px;color:var(--gold);pointer-events:auto}.sound{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;border:2px solid #ffffff66;box-shadow:0 7px 0 #321361;font-size:25px;pointer-events:auto}
.arena{position:absolute;inset:78px 16px 118px;display:grid;grid-template-columns:minmax(150px,22%) minmax(260px,1fr) minmax(220px,30%);align-items:center;gap:16px}
.panel{position:relative;min-height:70%;border-radius:34px;background:linear-gradient(155deg,#ffffff1f,#ffffff08);border:2px solid #ffffff38;box-shadow:inset 0 1px #ffffff55,0 20px 40px #09001e55;backdrop-filter:blur(5px)}
.royal-panel{align-self:stretch;display:flex;align-items:center;justify-content:center;padding:70px 12px 14px}.royal-panel:before{content:"♛";position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:38px;color:var(--gold);filter:drop-shadow(0 0 12px #fff)}
.royal-dock{width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}.royal-token{position:relative;width:min(12vw,122px);height:min(18vh,132px);min-width:88px;min-height:98px;padding:5px;border-radius:34px;background:linear-gradient(145deg,#fff,#cdaaff);border:4px solid #fff;box-shadow:0 9px 0 #56228d,0 0 25px var(--glow,#d36cff);cursor:grab;user-select:none;transition:.2s ease}.royal-token:active{cursor:grabbing;transform:scale(.94)}.royal-token img{width:100%;height:100%;object-fit:contain;border-radius:27px;background:radial-gradient(circle,#f2d7ff,#7542ca)}.royal-token .badge{position:absolute;right:-8px;bottom:-6px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glow,#b15dff);border:3px solid #fff;font-size:24px;box-shadow:0 4px 0 #401171}.royal-token .crown{position:absolute;top:-20px;left:50%;transform:translateX(-50%) rotate(-5deg);font-size:32px;filter:drop-shadow(0 3px 2px #6f3600)}
.princess-zone{position:relative;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.25s}.princess-zone.ready{background:radial-gradient(circle,#ffffff44 0 26%,#cf8cff33 45%,transparent 68%);box-shadow:inset 0 0 70px #d594ff55}.princess-img{position:relative;z-index:5;height:min(62vh,540px);max-width:95%;object-fit:contain;filter:drop-shadow(0 24px 26px #09001dbb);transition:filter .45s ease,transform .45s ease}.princess-img.transformed{transform:scale(1.04);filter:var(--form-filter) drop-shadow(0 0 28px var(--form-color)) drop-shadow(0 25px 24px #08001c)}
.drop-ring{position:absolute;z-index:3;width:min(45vw,430px);aspect-ratio:1;border-radius:50%;border:5px dashed #fff;opacity:0;transform:scale(.7);transition:.2s}.princess-zone.drop-active .drop-ring{opacity:1;transform:scale(1);animation:spin 4s linear infinite;box-shadow:0 0 45px #fff,inset 0 0 60px #c578ff88}
.trouble-panel{align-self:stretch;display:flex;align-items:center;justify-content:center;padding:76px 12px 14px;overflow:hidden}.portal{position:absolute;z-index:8;top:10px;left:50%;transform:translateX(-50%);width:72px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:29px;font-weight:900;background:radial-gradient(circle,#fff,#c97dff 28%,#49228d 65%,#16082f);border:3px solid #fff;box-shadow:0 0 24px #ce7cff;animation:portalPulse 1.3s ease-in-out infinite}.trouble-zone{width:100%;height:100%;display:flex;flex-direction:column-reverse;justify-content:center;gap:9px}.trouble-card{position:relative;width:100%;height:min(21vh,150px);min-height:104px;border-radius:30px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 55%,#ffffff55,transparent 55%),linear-gradient(145deg,var(--t1),var(--t2));border:3px solid #ffffffaa;box-shadow:0 8px 0 #341162,0 0 24px var(--t1);animation:troubleIn .6s cubic-bezier(.2,.9,.2,1),mischief 1.1s ease-in-out infinite;cursor:pointer}.trouble-card.selected{outline:6px solid #ffe675;outline-offset:2px}.trouble-card.hit{animation:targetHit .7s ease forwards}.trouble-card img{height:110%;width:72%;object-fit:contain;filter:var(--trouble-filter) drop-shadow(0 12px 10px #21044488)}.trouble-card .type-icon{position:absolute;left:8px;top:8px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#2a0d58aa;border:2px solid #fff;font-size:25px}.trouble-card .chaos{position:absolute;inset:0;pointer-events:none}.trouble-card .chaos i{position:absolute;font-style:normal;font-size:24px;animation:chaos 1.5s ease-in-out infinite}.trouble-card .chaos i:nth-child(1){left:8%;bottom:10%}.trouble-card .chaos i:nth-child(2){right:9%;top:8%;animation-delay:-.5s}.trouble-card .chaos i:nth-child(3){right:14%;bottom:6%;animation-delay:-1s}
.drag-ghost{position:fixed;z-index:100;width:130px;height:140px;object-fit:contain;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 18px 18px #080019aa);animation:ghostPulse .7s ease-in-out infinite}.drag-hint{position:absolute;z-index:20;left:13%;top:42%;width:95px;height:105px;pointer-events:none;animation:hintDrag 2.4s ease-in-out infinite}.drag-hint img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px #22053e)}.drag-hint:after{content:"☝️";position:absolute;right:-26px;bottom:-22px;font-size:48px}
.attack-dock{position:absolute;z-index:30;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;justify-content:center}.attack-dock.show{display:flex}.attack-btn{position:relative;width:116px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:56px;background:radial-gradient(circle at 35% 28%,#fff,var(--form-color) 35%,#3b176a 88%);border:5px solid #fff;box-shadow:0 10px 0 #32105e,0 0 40px var(--form-color);animation:attackPulse 1.2s ease-in-out infinite}.attack-btn:active{transform:translateY(7px);box-shadow:0 3px 0 #32105e}.attack-btn:disabled{filter:grayscale(.8);opacity:.55}
.beam{position:fixed;z-index:60;height:32px;border-radius:999px;pointer-events:none;transform-origin:0 50%;opacity:0;background:linear-gradient(90deg,#fff,var(--beam-color),#fff);box-shadow:0 0 16px #fff,0 0 40px var(--beam-color);overflow:visible}.beam.fire{animation:beamFire 1.25s ease forwards}.beam:before,.beam:after{content:attr(data-symbol);position:absolute;top:50%;font-size:38px;color:#fff;text-shadow:0 0 12px var(--beam-color)}.beam:before{left:32%;animation:beamParticle .55s linear infinite}.beam:after{left:72%;animation:beamParticle .55s linear infinite -.25s}
.capture-layer{position:absolute;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:#10032355;backdrop-filter:blur(3px)}.capture-layer.show{display:flex}.capture-bubble{position:relative;width:min(42vw,380px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 25%,#fff 0 4%,#ffffff55 6%,transparent 24%),linear-gradient(145deg,#f2c4ff55,#75c9ff33);border:6px solid #fff;box-shadow:inset -30px -35px 50px #762caf66,inset 24px 18px 36px #ffffff88,0 0 36px #fff,0 0 95px #b15fff;animation:bob 1.5s ease-in-out infinite}.capture-bubble img{width:70%;height:70%;object-fit:contain;filter:var(--capture-filter) drop-shadow(0 14px 12px #36105c99)}.capture-count{position:absolute;right:3%;top:3%;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:51px;font-weight:900;background:linear-gradient(#ffe47a,#ff9f48);border:5px solid #fff;box-shadow:0 7px 0 #984b2f;color:#fff;text-shadow:0 3px 0 #803323}.capture-bubble.tap{animation:bubbleTap .28s ease}
.transform-scene{position:absolute;inset:0;z-index:120;display:none;overflow:hidden;background:radial-gradient(circle,#6b30a6,#13052c 66%,#060014)}.transform-scene.show{display:block}.transform-stars{position:absolute;inset:-20%;background:conic-gradient(transparent,var(--form-color),transparent,#ffffff55,transparent);filter:blur(20px);animation:spin 5s linear infinite}.magic-circle{position:absolute;left:50%;top:50%;width:min(80vmin,650px);aspect-ratio:1;border-radius:50%;border:5px solid #fff;transform:translate(-50%,-50%) scale(.2);box-shadow:0 0 35px #fff,inset 0 0 75px var(--form-color),0 0 100px var(--form-color);animation:circleGrow 5.2s ease forwards}.magic-circle:before,.magic-circle:after{content:"";position:absolute;inset:9%;border-radius:50%;border:4px dashed var(--form-color);animation:spin 3s linear infinite}.magic-circle:after{inset:21%;border-style:solid;animation-direction:reverse}.ribbon{position:absolute;left:50%;top:50%;width:120vmax;height:40px;background:linear-gradient(90deg,transparent,#fff,var(--form-color),#fff,transparent);transform-origin:center;filter:blur(2px);opacity:0}.transform-scene.show .r1{animation:ribbonOne 5.2s ease forwards}.transform-scene.show .r2{animation:ribbonTwo 5.2s ease forwards}.transform-princess{position:absolute;z-index:5;left:50%;top:51%;height:min(82vh,700px);max-width:74vw;object-fit:contain;transform:translate(-50%,-50%) scale(.12);opacity:0;filter:brightness(0) drop-shadow(0 0 35px #fff)}.transform-scene.show .transform-princess{animation:transformHero 5.2s cubic-bezier(.2,.75,.2,1) forwards}.transform-emblem{position:absolute;z-index:8;left:50%;top:50%;font-size:min(22vw,170px);transform:translate(-50%,-50%) scale(0);filter:drop-shadow(0 0 24px #fff);animation:emblemFlash 5.2s ease forwards}.transform-crown{position:absolute;z-index:9;left:50%;top:7%;font-size:min(15vw,110px);transform:translate(-50%,-120vh) rotate(-35deg);filter:drop-shadow(0 8px 5px #7a3c00);animation:crownFall 5.2s ease forwards}.transform-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:finalFlash 5.2s ease forwards}.skip{position:absolute;z-index:20;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));width:68px;height:58px;border-radius:22px;display:grid;place-items:center;background:#ffffff22;border:2px solid #ffffff77;font-size:32px}
.mischief-fx{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden}.mischief-fx i{position:absolute;font-style:normal;font-size:34px;animation:messFly 2.1s ease forwards;filter:drop-shadow(0 0 9px #fff)}.confetti{position:absolute;inset:0;z-index:150;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-8%;left:var(--x);font-style:normal;font-size:25px;color:var(--c);animation:fall var(--d) linear forwards}
.hidden{display:none!important}.shake{animation:screenShake .42s ease}
@keyframes stars{to{background-position:116px 58px}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-15px) rotate(3deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.12)}}@keyframes portalPulse{50%{transform:translateX(-50%) scale(1.1);filter:brightness(1.25)}}@keyframes troubleIn{0%{transform:translateY(-160px) scale(.1) rotate(20deg);opacity:0}75%{transform:scale(1.1) rotate(-4deg)}}@keyframes mischief{0%,100%{transform:rotate(-2deg) translateX(-2px)}50%{transform:rotate(3deg) translateX(4px)}}@keyframes chaos{50%{transform:translateY(-18px) rotate(18deg) scale(1.3)}}@keyframes targetHit{35%{transform:translateX(-20px) rotate(-12deg);filter:brightness(2)}70%{transform:translateX(18px) rotate(10deg)}100%{transform:scale(.2);opacity:0}}@keyframes ghostPulse{50%{transform:translate(-50%,-50%) scale(1.16)}}@keyframes hintDrag{0%,15%{transform:translate(0,20px);opacity:0}25%{opacity:.8}75%{transform:translate(28vw,-3vh);opacity:.9}90%,100%{transform:translate(28vw,-3vh);opacity:0}}@keyframes attackPulse{50%{transform:scale(1.08);filter:brightness(1.18)}}@keyframes beamFire{0%{opacity:0;transform:var(--beam-transform) scaleX(.03)}18%,72%{opacity:1;transform:var(--beam-transform) scaleX(1)}100%{opacity:0;transform:var(--beam-transform) scaleX(1.12)}}@keyframes beamParticle{to{transform:translate(130px,-50%) rotate(360deg)}}@keyframes bob{50%{transform:translateY(-13px) scale(1.02)}}@keyframes bubbleTap{50%{transform:scale(.86)}}@keyframes circleGrow{0%{transform:translate(-50%,-50%) scale(.08);opacity:0}18%{opacity:1}60%{transform:translate(-50%,-50%) scale(1) rotate(160deg)}100%{transform:translate(-50%,-50%) scale(1.2) rotate(260deg);opacity:.5}}@keyframes ribbonOne{18%{opacity:0}32%,73%{opacity:1;transform:translate(-50%,-50%) rotate(30deg) scaleY(1)}88%{opacity:0;transform:translate(-50%,-50%) rotate(190deg) scaleY(3)}}@keyframes ribbonTwo{24%{opacity:0}38%,76%{opacity:1;transform:translate(-50%,-50%) rotate(-35deg) scaleY(1.2)}90%{opacity:0;transform:translate(-50%,-50%) rotate(-210deg) scaleY(2.8)}}@keyframes transformHero{0%,12%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(-25deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(.65) rotate(4deg);filter:brightness(0) drop-shadow(0 0 40px #fff)}48%{transform:translate(-50%,-50%) scale(.9) rotate(-2deg);filter:brightness(0) drop-shadow(0 0 60px var(--form-color))}67%{filter:var(--form-filter) brightness(2) drop-shadow(0 0 55px #fff)}82%,100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:var(--form-filter) drop-shadow(0 0 38px var(--form-color))}}@keyframes emblemFlash{0%,18%{transform:translate(-50%,-50%) scale(0);opacity:0}28%{transform:translate(-50%,-50%) scale(1.7);opacity:1}43%{transform:translate(-50%,-50%) scale(.55) rotate(180deg);opacity:.5}62%,100%{transform:translate(-50%,-50%) scale(0) rotate(360deg);opacity:0}}@keyframes crownFall{0%,67%{transform:translate(-50%,-120vh) rotate(-35deg)}81%{transform:translate(-50%,6px) rotate(8deg)}88%,100%{transform:translate(-50%,0) rotate(0)}}@keyframes finalFlash{0%,76%{opacity:0}82%{opacity:.92}91%,100%{opacity:0}}@keyframes messFly{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(1.5);opacity:0}}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}@keyframes screenShake{25%{transform:translateX(-13px)}50%{transform:translateX(12px)}75%{transform:translateX(-7px)}}@keyframes popIn{0%{transform:scale(.1) rotate(-30deg)}70%{transform:scale(1.2) rotate(8deg)}} 
@media(max-aspect-ratio:4/5){.game{min-height:650px}.arena{inset:76px 9px 126px;grid-template-columns:92px 1fr 116px;gap:7px}.panel{border-radius:25px}.royal-panel{padding:58px 6px 8px}.royal-dock{gap:9px}.royal-token{width:76px;height:92px;min-width:0;min-height:0;border-radius:24px}.royal-token img{border-radius:18px}.royal-token .badge{width:34px;height:34px;font-size:19px}.royal-token .crown{font-size:25px;top:-17px}.princess-img{height:min(53vh,520px);max-width:120%}.trouble-panel{padding:64px 5px 8px}.trouble-card{height:112px;min-height:88px;border-radius:22px}.trouble-card img{width:95%;height:105%}.trouble-card .type-icon{width:34px;height:34px;font-size:20px}.portal{width:58px;height:49px;font-size:24px}.drag-hint{left:7%;width:72px;height:84px}.attack-btn{width:108px;height:92px}.capture-bubble{width:min(74vw,380px)}.intro-art{gap:7vw}.intro-art img{width:43vw;max-width:220px}.hud{left:8px;right:8px}}
@media(prefers-reduced-motion:reduce){.trouble-card,.intro-art{animation-duration:3s}.transform-scene.show .transform-princess,.magic-circle,.ribbon,.transform-emblem,.transform-crown,.transform-flash{animation-duration:3.2s}}
</style>
</head>
<body>
<div class="game" id="game">
  <section class="screen active" id="intro">
    <div class="intro-box"><div class="intro-moon"></div><div class="intro-orbit"></div><div class="intro-art"><img data-art="music" alt=""><img data-art="girl" alt=""></div><button class="play-btn" id="play" aria-label="开始">▶</button></div>
  </section>
  <section class="screen" id="playScreen">
    <div class="hud"><div class="counter"><span>♛</span><b id="royalCount">1</b></div><button class="sound" id="sound" aria-label="声音">🔊</button></div>
    <div class="arena">
      <aside class="panel royal-panel"><div class="royal-dock" id="royalDock"></div></aside>
      <main class="princess-zone ready" id="princessZone"><div class="drop-ring"></div><img class="princess-img" id="princess" data-art="girl" alt=""></main>
      <aside class="panel trouble-panel"><div class="portal" id="countdown">3</div><div class="trouble-zone" id="troubleZone"></div></aside>
    </div>
    <div class="drag-hint" id="dragHint"><img data-art="love" alt=""></div>
    <div class="attack-dock" id="attackDock"><button class="attack-btn" id="attackBtn" aria-label="光波攻击">♥</button></div>
    <div class="beam" id="beam"></div>
    <div class="capture-layer" id="captureLayer"><button class="capture-bubble" id="captureBubble" aria-label="捕捉"><img id="captureImg" data-art="love" alt=""><span class="capture-count" id="captureCount">3</span></button></div>
    <div class="mischief-fx" id="mischiefFx"></div>
  </section>
  <section class="transform-scene" id="transformScene"><div class="transform-stars"></div><div class="magic-circle"></div><div class="ribbon r1"></div><div class="ribbon r2"></div><img class="transform-princess" id="transformPrincess" data-art="girl" alt=""><div class="transform-emblem" id="transformEmblem">♥</div><div class="transform-crown">♛</div><div class="transform-flash"></div><button class="skip" id="skip" aria-label="跳过">»</button></section>
  <div class="confetti" id="confetti"></div>
</div>

function chord(type){TYPES[type].tones.forEach((n,i)=>setTimeout(()=>tone(n,.24,i%2?'triangle':'sine'),i*150))}
function renderRoyals(){
 royalDock.innerHTML=owned.map(type=>{const t=TYPES[type];return `<button class="royal-token" data-type="${type}" style="--glow:${t.c1}" aria-label="皇室萌可"><span class="crown">♛</span><img src="${ART[t.royal]}" alt="" style="filter:${t.royalFilter}"><span class="badge">${t.icon}</span></button>`}).join('');
 $('#royalCount').textContent=owned.length;
 $$('.royal-token').forEach(el=>el.addEventListener('pointerdown',startDrag));
}
function startDrag(e){if(busy)return;e.preventDefault();dragHint.classList.add('hidden');const type=e.currentTarget.dataset.type,t=TYPES[type],ghost=document.createElement('img');ghost.className='drag-ghost';ghost.src=ART[t.royal];ghost.style.filter=t.royalFilter;game.appendChild(ghost);moveGhost(e);princessZone.classList.add('drop-active');const move=ev=>moveGhost(ev),end=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);const r=princessZone.getBoundingClientRect(),inside=ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom;ghost.remove();princessZone.classList.remove('drop-active');if(inside)transform(type)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end)}
function moveGhost(e){const g=$('.drag-ghost');if(g){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}}
function transform(type){if(busy)return;busy=true;currentForm=type;const t=TYPES[type];setMusicMode('transform');transformPrincess.src=ART[`${type}Princess`];transformScene.style.cssText=typeVars(type);transformEmblem.textContent=t.icon;transformScene.classList.add('show');chord(type);[1,2,3,4].forEach((x,i)=>setTimeout(()=>tone(t.tones[i%t.tones.length],.35,'triangle'),900+i*680));transformTimer=setTimeout(()=>finishTransform(type),5250)}
function finishTransform(type){clearTimeout(transformTimer);const t=TYPES[type];setMusicMode('play');transformScene.classList.remove('show');princess.src=ART[`${type}Princess`];princess.style.cssText=typeVars(type);princess.classList.add('transformed');attackBtn.style.cssText=typeVars(type);attackBtn.textContent=t.icon;attackDock.classList.add('show');busy=false;chord(type)}
function spawnTrouble(){if(!playing||troubles.length>=3)return;const order=['justice','music','love'],type=order[spawnIndex++%order.length],t=TYPES[type],id=Date.now()+Math.random();const el=document.createElement('button');el.className='trouble-card';el.dataset.id=id;el.style.cssText=`--t1:${t.c1};--t2:${t.c2};--trouble-filter:${t.filter}`;el.setAttribute('aria-label','捣乱萌可');el.innerHTML=`<span class="type-icon">${t.icon}</span><img src="${ART[type]}" alt=""><span class="chaos"><i>${t.symbols[0]}</i><i>${t.symbols[1]}</i><i>${t.symbols[2]}</i></span>`;el.addEventListener('click',()=>selectTarget(id));troubleZone.appendChild(el);troubles.push({id,type,el});selectTarget(id);game.classList.add('shake');setTimeout(()=>game.classList.remove('shake'),450);mischiefBurst(t);tone(180,.18,'sawtooth')}
function selectTarget(id){selectedId=id;troubles.forEach(x=>x.el.classList.toggle('selected',x.id===id))}
function mischiefBurst(t){for(let i=0;i<11;i++){const p=document.createElement('i');p.textContent=t.symbols[i%t.symbols.length];p.style.left=62+Math.random()*30+'%';p.style.top=16+Math.random()*58+'%';p.style.color=t.c1;p.style.setProperty('--dx',(Math.random()*240-120)+'px');p.style.setProperty('--dy',(Math.random()*230-115)+'px');mischiefFx.appendChild(p);setTimeout(()=>p.remove(),2200)}}
function ambientMischief(){if(!troubles.length||busy)return;const x=troubles[Math.floor(Math.random()*troubles.length)],t=TYPES[x.type];mischiefBurst(t)}
function attack(){if(busy||!currentForm||!troubles.length)return;let target=troubles.find(x=>x.id===selectedId)||troubles[0];busy=true;attackBtn.disabled=true;const t=TYPES[currentForm],a=princess.getBoundingClientRect(),b=target.el.getBoundingClientRect(),x1=a.left+a.width*.68,y1=a.top+a.height*.48,x2=b.left+b.width*.38,y2=b.top+b.height*.52,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;beam.style.left=x1+'px';beam.style.top=(y1-16)+'px';beam.style.width=len+'px';beam.style.setProperty('--beam-color',t.c1);beam.style.setProperty('--beam-transform',`rotate(${ang}deg)`);beam.dataset.symbol=t.icon;beam.classList.remove('fire');void beam.offsetWidth;beam.classList.add('fire');chord(currentForm);for(let i=0;i<5;i++)setTimeout(()=>tone(t.tones[i%t.tones.length]+i*14,.2,i%2?'square':'sine'),i*130);setTimeout(()=>target.el.classList.add('hit'),760);setTimeout(()=>showCapture(target),1320)}
function showCapture(target){captureTarget=target;captureHits=3;captureCount.textContent='3';captureImg.src=ART[target.type];captureImg.style.filter=TYPES[target.type].filter;captureLayer.classList.add('show');beam.classList.remove('fire');busy=false}
function tapCapture(){if(!captureTarget)return;captureBubble.classList.remove('tap');void captureBubble.offsetWidth;captureBubble.classList.add('tap');captureHits--;tone([784,659,523][Math.max(0,captureHits)],.18);if(captureHits>0){captureCount.textContent=captureHits;return}completeCapture()}
function completeCapture(){const target=captureTarget,type=target.type;captureTarget=null;captureLayer.classList.remove('show');target.el.remove();troubles=troubles.filter(x=>x!==target);if(!owned.includes(type)){owned.push(type);localStorage.setItem('mengkeRoyalV2',JSON.stringify(owned));renderRoyals()}currentForm=null;princess.src=ART.girl;princess.classList.remove('transformed');princess.removeAttribute('style');attackDock.classList.remove('show');attackBtn.disabled=false;selectedId=troubles[0]?.id||null;if(selectedId)selectTarget(selectedId);confetti(32,TYPES[type]);spawnIn=Math.min(spawnIn,3);chord(type)}
function confetti(n,t){const box=$('#confetti');for(let i=0;i<n;i++){const p=document.createElement('i');p.textContent=t.symbols[i%t.symbols.length];p.style.setProperty('--x',Math.random()*100+'%');p.style.setProperty('--d',2.5+Math.random()*2.2+'s');p.style.setProperty('--c',[t.c1,t.c2,'#ffe775','#fff'][i%4]);box.appendChild(p);setTimeout(()=>p.remove(),5000)}}
function start(){ensureAudio();audio.resume();playing=true;setScreen(playScreen);renderRoyals();spawnIn=2;countdownEl.textContent=spawnIn;setTimeout(spawnTrouble,900);fxTimer=setInterval(ambientMischief,2300);setMusicMode('play');tone(523,.2)}
setInterval(()=>{if(!playing)return;if(troubles.length>=3){countdownEl.textContent='3';return}spawnIn--;if(spawnIn<=0){spawnTrouble();spawnIn=7}countdownEl.textContent=spawnIn},1000);
$('#play').addEventListener('click',start);$('#sound').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';ensureAudio();masterGain.gain.setTargetAtTime(muted?0:.82,audio.currentTime,.05);if(!muted){audio.resume();bgmNext=audio.currentTime+.05;tone(659,.2)}});attackBtn.addEventListener('click',attack);captureBubble.addEventListener('click',tapCapture);$('#skip').addEventListener('click',()=>currentForm&&finishTransform(currentForm));document.addEventListener('visibilitychange',()=>{if(!audio)return;if(document.hidden)audio.suspend();else if(playing&&!muted){audio.resume();bgmNext=audio.currentTime+.06}});document.addEventListener('contextmenu',e=>e.preventDefault());renderRoyals();
})();
</script>
</body>
</html>
