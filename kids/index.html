<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8f6ff">
<meta name="description" content="糖果星球：一个为小小探险家设计的原创3D互动游戏宇宙。">
<title>糖果星球 · 星芽的奇妙旅程</title>
<link rel="stylesheet" href="./experience.css">
</head>
<body>
<canvas id="scene" aria-label="糖果星球3D游戏世界"></canvas>
<div id="app">
<div class="sky-glow"></div>
<header class="top-hud" id="topHud">
  <div class="brand-pill"><div class="brand-logo">🐰</div><div><div class="brand-name">糖果星球</div><div class="brand-caption">CANDY PLANET</div></div></div>
  <div class="hud-actions">
    <div class="hud-pill star-counter" aria-label="收集的星星"><span>⭐</span><span id="starCount">0</span></div>
    <button class="icon-button" id="soundButton" aria-label="切换音效">🔊</button>
    <button class="icon-button" id="parentButton" aria-label="家长设置">⚙️</button>
  </div>
</header>
<section class="map-intro" id="mapIntro">
  <div class="intro-bubble"><span>✦</span><span>星芽正在等你一起玩</span><span>✦</span></div>
  <h1>今天，去哪里冒险？</h1>
  <p>每一个角落，都藏着新的惊喜。</p>
</section>
<div class="bottom-hint" id="mapHint"><span>👆</span><span>点一点岛屿，看看会发生什么</span><span>✨</span></div>
<nav class="world-dock" id="worldDock" aria-label="探索世界">
  <button class="world-card" data-world="bakery" aria-label="进入甜品王国"><span class="world-spark">✦</span><span class="world-emoji">🧁</span><span class="world-name">甜品王国</span></button>
  <button class="world-card" data-world="forest" aria-label="进入星光森林"><span class="world-spark">✦</span><span class="world-emoji">🌳</span><span class="world-name">星光森林</span></button>
  <button class="world-card" data-world="ocean" aria-label="进入梦幻海洋"><span class="world-spark">✦</span><span class="world-emoji">🐬</span><span class="world-name">梦幻海洋</span></button>
  <button class="world-card" data-world="garden" aria-label="进入四季花园"><span class="world-spark">✦</span><span class="world-emoji">🌷</span><span class="world-name">四季花园</span></button>
  <button class="world-card" data-world="dress" aria-label="进入星光衣橱"><span class="world-spark">✦</span><span class="world-emoji">👗</span><span class="world-name">星光衣橱</span></button>
  <button class="world-card" data-world="toy" aria-label="进入奇想玩具城"><span class="world-spark">✦</span><span class="world-emoji">🧸</span><span class="world-name">奇想玩具城</span></button>
</nav>
<section class="game-hud" id="gameHud" aria-label="游戏控制">
  <div class="game-top">
    <button class="icon-button" id="backButton" aria-label="返回星芽小镇">⌂</button>
    <div class="game-world-icon" id="gameWorldIcon">🧁</div>
    <div class="game-counter"><span id="gameProgressIcon">⭐</span><span id="gameProgress">0</span></div>
    <button class="icon-button" id="gameSoundButton" aria-label="切换音效">🔊</button>
  </div>
  <div class="recipe-display" id="recipeDisplay">🥣</div>
  <div class="pop-feedback" id="popFeedback">✨</div>
  <div class="game-tools">
    <div class="tool-shelf" id="bakeryBases" aria-label="食物底胚">
      <button class="tool-button selected" data-base="cake" aria-label="蛋糕胚">🎂</button>
      <button class="tool-button" data-base="pizza" aria-label="披萨底">🍕</button>
      <button class="tool-button" data-base="bread" aria-label="面包底">🍞</button>
      <button class="tool-button" data-base="soup" aria-label="汤锅">🍲</button>
    </div>
    <div class="tool-shelf" id="bakeryIngredients" aria-label="食材">
      <div class="tool-scroll" id="ingredientScroll">
        <button class="tool-button" data-ingredient="strawberry" aria-label="草莓">🍓</button>
        <button class="tool-button" data-ingredient="banana" aria-label="香蕉">🍌</button>
        <button class="tool-button" data-ingredient="blueberry" aria-label="蓝莓">🫐</button>
        <button class="tool-button" data-ingredient="chocolate" aria-label="巧克力">🍫</button>
        <button class="tool-button" data-ingredient="cream" aria-label="奶油">🥛</button>
        <button class="tool-button" data-ingredient="sprinkles" aria-label="糖针">🍬</button>
        <button class="tool-button" data-ingredient="cheese" aria-label="芝士">🧀</button>
        <button class="tool-button" data-ingredient="broccoli" aria-label="西兰花">🥦</button>
        <button class="tool-button" data-ingredient="fish" aria-label="小鱼">🐟</button>
        <button class="tool-button" data-ingredient="tomato" aria-label="番茄">🍅</button>
        <button class="tool-button" data-ingredient="egg" aria-label="鸡蛋">🥚</button>
        <button class="tool-button" data-ingredient="mushroom" aria-label="蘑菇">🍄</button>
        <button class="tool-button" data-ingredient="honey" aria-label="蜂蜜">🍯</button>
        <button class="tool-button" data-ingredient="carrot" aria-label="胡萝卜">🥕</button>
        <button class="tool-button" data-ingredient="marshmallow" aria-label="棉花糖">🍡</button>
      </div>
    </div>
    <div class="tool-shelf" id="bakeryActions">
      <button class="tool-button" id="mixButton" aria-label="搅拌">🥣</button>
      <button class="tool-button primary" id="bakeButton" aria-label="烘焙或烹饪">🔥</button>
      <button class="tool-button" id="clearButton" aria-label="清理工作台">🧹</button>
      <button class="tool-button" id="newGuestButton" aria-label="换一位小客人">🐻</button>
    </div>
    <div class="tool-shelf" id="gardenTools">
      <button class="tool-button selected" data-garden-tool="seed" aria-label="播种">🌰</button>
      <button class="tool-button" data-garden-tool="water" aria-label="浇水">💧</button>
      <button class="tool-button" data-garden-tool="sun" aria-label="晒太阳">☀️</button>
      <button class="tool-button" data-garden-tool="harvest" aria-label="采收">🧺</button>
    </div>
    <div class="tool-shelf" id="forestTools">
      <button class="tool-button" id="forestLantern" aria-label="照亮森林">🏮</button>
      <button class="tool-button" id="forestCall" aria-label="呼唤小动物">🐿️</button>
      <button class="tool-button" id="forestBasket" aria-label="收集发现">🧺</button>
    </div>
    <div class="tool-shelf" id="oceanTools">
      <button class="tool-button selected" data-ocean-tool="bubble" aria-label="追泡泡">🫧</button>
      <button class="tool-button" data-ocean-tool="feed" aria-label="喂小鱼">🐠</button>
      <button class="tool-button" data-ocean-tool="clean" aria-label="清理海藻">🌿</button>
      <button class="tool-button" data-ocean-tool="shell" aria-label="寻找贝壳">🐚</button>
    </div>
    <div class="tool-shelf" id="dressTools">
      <div class="tool-scroll">
        <button class="tool-button selected" data-outfit="fairy" aria-label="星光精灵">🧚</button>
        <button class="tool-button" data-outfit="ocean" aria-label="海洋公主">🧜‍♀️</button>
        <button class="tool-button" data-outfit="garden" aria-label="花园仙子">🌷</button>
        <button class="tool-button" data-outfit="royal" aria-label="皇冠造型">👑</button>
        <button class="tool-button" data-outfit="candy" aria-label="糖果造型">🍬</button>
        <button class="tool-button" data-outfit="rainbow" aria-label="彩虹造型">🌈</button>
      </div>
      <button class="tool-button" data-accessory="wings" aria-label="添加翅膀">🪽</button>
      <button class="tool-button" data-accessory="bow" aria-label="添加蝴蝶结">🎀</button>
      <button class="tool-button" data-accessory="flower" aria-label="添加花朵">🌼</button>
      <button class="tool-button" data-accessory="crown" aria-label="添加皇冠">💎</button>
      <button class="tool-button good" id="dressPose" aria-label="拍一张造型照">📸</button>
    </div>
    <div class="tool-shelf" id="toyTools">
      <button class="tool-button selected" data-toy-piece="block" aria-label="积木">🧱</button>
      <button class="tool-button" data-toy-piece="ramp" aria-label="斜坡">🛝</button>
      <button class="tool-button" data-toy-piece="gear" aria-label="齿轮">⚙️</button>
      <button class="tool-button" data-toy-piece="bridge" aria-label="桥">🌉</button>
      <button class="tool-button good" id="toyLaunch" aria-label="启动玩具机关">▶️</button>
      <button class="tool-button" id="toyClear" aria-label="清理积木">🧹</button>
    </div>
    <div class="tool-shelf" id="commonTools">
      <button class="tool-button" id="repeatButton" aria-label="重新开始当前世界">↻</button>
      <button class="tool-button" id="townButton" aria-label="回到小镇">🏡</button>
      <button class="tool-button" id="surpriseButton" aria-label="给我一个惊喜">🎁</button>
    </div>
  </div>
  <div class="reward-overlay" id="rewardOverlay">
    <div class="reward-card">
      <div class="reward-icon" id="rewardIcon">🌟</div>
      <div class="reward-stars" id="rewardStars">⭐ ⭐ ⭐</div>
      <button class="reward-button" id="rewardContinue" aria-label="继续玩">➜</button>
    </div>
  </div>
</section>
<section class="parent-modal" id="parentModal" role="dialog" aria-modal="true" aria-labelledby="parentTitle">
  <div class="parent-card">
    <div style="font-size:46px">👨‍👩‍👧</div><h2 id="parentTitle">家长小角落</h2>
    <p>糖果星球不需要账号，也没有广告。游戏进度只保存在这台设备上。</p>
    <div class="parent-actions"><button id="parentClose">返回游戏</button><button class="primary" id="resetProgress">重置贴纸</button></div>
  </div>
</section>
<div class="world-label" id="worldLabel"></div>
<div class="visually-hidden" id="liveRegion" aria-live="polite"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="./experience.js"></script>
</body>
</html>
