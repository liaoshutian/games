<header class="topbar"><div class="brand"><div class="brand-mark">🌟</div><div><div class="brand-title">糖果星球</div><div class="brand-subtitle">CANDY PLANET · 萌萌冒险乐园</div></div></div><div class="top-actions"><button class="soft-button" id="soundToggle" aria-pressed="false">🔔 音效开</button><button class="soft-button" id="myStickers">🎖️ <span id="stickerTotal">0</span></button></div></header>
<section class="hero"><div class="hero-copy"><span class="eyebrow">✨ 专属小小探险家</span><h1>和 <span class="pink">星芽</span><br>一起去冒险！</h1><p>穿越奇妙的立体世界，收集星星、照顾花朵、探索海底！每一次点击，都是一场小小的惊喜。</p><button class="primary-button" id="startAdventure">开始冒险 <span>➜</span></button><div class="hero-notes"><span>🧸 轻松无压力</span><span>👆 触屏就能玩</span><span>🔒 不用注册</span></div></div><div class="hero-art" aria-label="原创角色星芽"><div class="rainbow"></div><span class="hero-bunny">🐰</span><span class="hero-star star-a">✦</span><span class="hero-star star-b">✧</span><span class="hero-star star-c">★</span><span class="hero-cloud">☁️</span></div></section>
