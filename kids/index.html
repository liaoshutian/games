<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3fb"><meta name="description" content="糖果星球：为3到6岁小朋友设计的原创Q版3D小游戏乐园。">
<title>糖果星球 · 萌萌冒险乐园</title>
<style>
:root{--ink:#513b69;--muted:#9382a2;--pink:#ff8dc8;--purple:#a68cff;--blue:#8edcf5;--yellow:#ffdc78;--mint:#a8ebd4;--shadow:0 18px 44px #9067a51c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Arial Rounded MT Bold","PingFang SC","Microsoft YaHei",ui-rounded,system-ui,sans-serif;background:radial-gradient(ellipse at 5% 8%,#ffe0f1 0,transparent 28%),radial-gradient(ellipse at 95% 18%,#d9f5ff 0,transparent 30%),radial-gradient(ellipse at 50% 95%,#e9e1ff 0,transparent 32%),#fff9fd;overflow-x:hidden}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}button:focus-visible{outline:4px solid #72c9eb;outline-offset:3px}.page{width:min(1180px,calc(100% - 32px));margin:auto;padding:20px 0 34px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:59px;height:59px;display:grid;place-items:center;border:3px solid white;border-radius:22px;background:linear-gradient(145deg,#ffb9df,#c7b7ff);box-shadow:0 8px 18px #bd91d544;font-size:31px;transform:rotate(-4deg);flex-shrink:0}.brand-title{font-size:clamp(21px,3vw,29px);font-weight:1000;line-height:1.15}.brand-subtitle{margin-top:5px;color:var(--muted);font-size:12px;font-weight:800}.top-actions{display:flex;gap:8px}.soft-button{border:2px solid #fff;background:#ffffffce;border-radius:999px;padding:10px 14px;color:var(--ink);font-weight:900;box-shadow:0 5px 14px #8c6da010;white-space:nowrap}.soft-button:hover{background:#fff;transform:translateY(-1px)}
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;min-height:292px;padding:33px 40px;margin-bottom:29px;border:3px solid #fff;border-radius:38px;overflow:hidden;background:linear-gradient(112deg,#ffe2f2,#f4e9ff 49%,#e1f8ff);box-shadow:var(--shadow)}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;z-index:-1}.hero:before{width:320px;height:320px;background:#ffffff70;right:13%;top:-205px}.hero:after{width:240px;height:240px;background:#ffc5e566;right:-50px;bottom:-145px}.hero-copy{position:relative;z-index:2}.eyebrow{display:inline-flex;align-items:center;gap:7px;border:2px solid #fff;border-radius:999px;padding:7px 12px;background:#ffffffb8;font-size:13px;font-weight:1000;color:#986ba4}h1{font-size:clamp(34px,5vw,58px);line-height:1.1;letter-spacing:-.035em;margin:17px 0 12px;font-weight:1000}h1 .pink{color:#ed6cae;text-shadow:0 3px #fff}.hero-copy p{max-width:440px;color:#826e96;font-weight:750;line-height:1.8;font-size:16px;margin:0 0 20px}
.primary-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:999px;padding:15px 23px;background:linear-gradient(135deg,#ff91c9,#f779b9);color:#fff;font-size:17px;font-weight:1000;box-shadow:0 7px 0 #d65b9b,0 13px 22px #e975b344;transition:transform .18s;cursor:pointer}.primary-button:hover{transform:translateY(-2px)}.hero-notes{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;color:#8e7b9e;font-size:12px;font-weight:850}.hero-notes span{background:#ffffffa8;border-radius:999px;padding:7px 10px}.hero-art{position:relative;min-height:220px;display:grid;place-items:center}.rainbow{position:absolute;width:270px;height:155px;border-radius:160px 160px 20px 20px;border:17px solid transparent;border-top-color:#ffb2d8;border-left-color:#ffb2d8;border-right-color:#a9a1ff;transform:rotate(-8deg);filter:drop-shadow(0 7px 0 #fff8)}.rainbow:before{content:"";position:absolute;inset:8px;border-radius:130px 130px 15px 15px;border:13px solid transparent;border-top-color:#ffe28b;border-left-color:#ffe28b;border-right-color:#9de4f4}.rainbow:after{content:"";position:absolute;inset:29px;border-radius:100px 100px 10px 10px;border:12px solid transparent;border-top-color:#b9efd9;border-left-color:#b9efd9;border-right-color:#ffb4d6}.hero-bunny{position:relative;z-index:1;font-size:clamp(112px,17vw,166px);line-height:1;filter:drop-shadow(0 15px 9px #ad78b633);animation:bob 3.2s ease-in-out infinite}.hero-star{position:absolute;font-size:30px;filter:drop-shadow(0 3px #fff);animation:twinkle 2.5s ease-in-out infinite}.star-a{left:9%;top:24%;color:#ffbe48}.star-b{right:8%;top:15%;color:#ef8bc4}.star-c{right:14%;bottom:13%;color:#7fcfea}.hero-cloud{position:absolute;bottom:8%;left:4%;font-size:46px}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@keyframes twinkle{0%,100%{transform:scale(.86);opacity:.65}50%{transform:scale(1.13);opacity:1}}
