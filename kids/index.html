accessory="";$("dialogIcon").textContent=data.icon;$("dialogTitle").textContent=data.title;$("dialogSubtitle").textContent="";$("missionTitle").textContent="";$("missionText").textContent="";$("shapePrompt").hidden=key!=="shapes";$("fashionOptions").hidden=key!=="fashion";$("kitchenTools").hidden=key!=="kitchen";$("gardenTools").hidden=key!=="garden";$("shapeTools").hidden=key!=="shapes";$("recipeStatus").hidden=key!=="kitchen";$("rewardScreen").classList.remove("show");$("sceneHint").hidden=true;document.querySelectorAll("[data-garden-tool]").forEach(b=>b.classList.toggle("selected",b.dataset.gardenTool==="seed"));document.querySelectorAll("[data-base]").forEach(b=>b.classList.toggle("selected",b.dataset.base==="cake"));document.querySelectorAll("[data-ingredient]").forEach(b=>b.classList.remove("selected"));document.querySelectorAll("[data-outfit]").forEach(b=>b.classList.toggle("selected",b.dataset.outfit==="fairy"));document.querySelectorAll("[data-accessory]").forEach(b=>b.classList.remove("selected"));if(key==="shapes")spawnShapeRound();updateProgress();updateRecipeStatus();function applyOutfit(name){activeOutfit=name;if(!mascot)return;const sets={fairy:{body:"#a8e6d4",ear:"#c5b4ff",tail:"#ffb6d8",star:"#ffdc78"},ocean:{body:"#8edcf5",ear:"#71bfe6",tail:"#71bfe6",star:"#ffadd8"},garden:{body:"#ffc5d9",ear:"#a9d99f",tail:"#a9d99f",star:"#ffdc78"},royal:{body:"#c1a2ff",ear:"#ffb8d9",tail:"#ffb8d9",star:"#ffdc78"},candy:{body:"#ff9fca",ear:"#ffda7c",tail:"#b99cff",star:"#fff2a8"},rainbow:{body:"#9ddfff",ear:"#ffb8d9",tail:"#a9e9be",star:"#ffda67"}};const c=sets[name]||sets.fairy;mascot.children[0].material.color.set(c.body);mascot.userData.ears.forEach(e=>e.material.color.set(c.ear));mascot.userData.tail.material.color.set(c.tail);mascot.children[11].material.color.set(c.star);mascot.children[11].material.emissive.set(c.star);mascot.userData.belly.material.color.set(name==="rainbow"?"#ffe5a7":"#f7fff7");if(mascot.userData.accessoryGroup){mascot.remove(mascot.userData.accessoryGroup);mascot.userData.accessoryGroup.traverse(o=>{if(o.geometry)o.geometry.dispose?.();if(o.material)o.material.dispose?.()});}const acc=new THREE.Group();mascot.add(acc);mascot.userData.accessoryGroup=acc;if(name==="royal"){for(let i=0;i<3;i++)cone(acc,(i-1)*.2,2.13,.01,.12,.3,["#ffcf59","#ff8ec7","#ffcf59"][i]);box(acc,0,2.0,.02,.55,.1,.12,"#ffd65e");}else if(name==="candy"){ball(acc,0,2.03,.03,.22,.22,.15,"#ff7ab7");ball(acc,.15,2.08,.03,.16,.15,.13,"#ffc8e4");}else if(name==="rainbow"){for(let i=0;i<3;i++){const arc=ball(acc,0,1.18,-.03,.45-i*.09,.07,.09,["#ff9ecb","#ffdb78","#85dcb9"][i]);arc.rotation.z=-.2;}}else if(name==="ocean"){ball(acc,-.7,1.25,-.12,.24,.38,.09,"#b7efff");ball(acc,.7,1.25,-.12,.24,.38,.09,"#b7efff");}else if(name==="garden"){for(let i=0;i<3;i++)ball(acc,(i-1)*.15,2.0,.04,.14,.14,.1,["#ff8fbc","#ffda78","#a7e7bd"][i]);}else{ball(acc,-.14,2.0,.04,.15,.12,.1,"#ff9acb");ball(acc,.14,2.0,.04,.15,.12,.1,"#a88bff");ball(acc,0,2.05,.09,.08,.08,.07,"#ffda67");}if(accessory){addAccessory(accessory);}}
function addAccessory(kind){if(!mascot)return;accessory=kind;let g=mascot.userData.accessoryGroup;if(!g){g=new THREE.Group();mascot.add(g);mascot.userData.accessoryGroup=g;}if(kind==="wings"){const a=ball(g,-.58,1.12,-.3,.3,.42,.1,"#d5f4ff",{transparent:true,opacity:.85});a.rotation.z=-.35;const b=ball(g,.58,1.12,-.3,.3,.42,.1,"#ffd7ee",{transparent:true,opacity:.85});b.rotation.z=.35;}else if(kind==="bow"){ball(g,-.18,2.0,.1,.18,.13,.09,"#ff89c5");ball(g,.18,2.0,.1,.18,.13,.09,"#ff89c5");ball(g,0,2.0,.15,.09,.09,.08,"#ffdc78");}else if(kind==="flower"){for(let i=0;i<5;i++){const a=i*Math.PI*2/5;ball(g,Math.cos(a)*.14,2.03+Math.sin(a)*.14,.12,.1,.1,.08,"#ff9fca");}ball(g,0,2.03,.17,.08,.08,.06,"#ffdc78");}else if(kind==="crown"){for(let i=0;i<3;i++)cone(g,(i-1)*.18,2.14,.04,.12,.28,["#ffda67","#ff8ec7","#ffda67"][i]);box(g,0,2.0,.04,.5,.1,.12,"#ffd65e");}showWorldPop(({wings:"🪽",bow:"🎀",flower:"🌼",crown:"👑"})[kind]||"✨");}
function updateProgress(){const data=games[current];$("sceneProgress").textContent=current==="fashion"?"👗 "+progress+" / "+data.goal:data.kind==="bubble"?"🫧 "+progress+" / "+data.goal:data.kind==="garden"?"🌷 "+progress+" / "+data.goal:data.kind==="kitchen"?"🍓 "+progress+" / "+data.goal:data.kind==="shapes"?"⭐ "+progress+" / "+data.goal:"⭐ "+progress+" / "+data.goal;$("progressFill").style.width=Math.min(100,progress/data.goal*100)+"%";}
function showToast(text){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;z-index:50;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100% - 28px);padding:13px 18px;border:3px solid #fff;border-radius:999px;background:#fff1f9;color:#765c8a;box-shadow:0 10px 35px #5a347733;font-weight:950;text-align:center;font-size:14px;transition:opacity .2s";document.body.appendChild(t)}t.textContent=text;t.style.opacity="1";clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.opacity="0",2300)}
let audioContext=null;function playTone(freq){if(!soundOn)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type="sine";o.frequency.value=freq||660;g.gain.setValueAtTime(.0001,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.12,audioContext.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.22);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.23)}catch(e){}}
function burst(x,y,z,color){for(let i=0;i<7;i++){const p=ball(worldRoot,x,y,z,.07,.07,.07,color);p.userData.vx=(Math.random()-.5)*.12;p.userData.vy=.05+Math.random()*.1;p.userData.vz=(Math.random()-.5)*.12;p.userData.life=1;particles.push(p)}}
function finishGame(){if(completed)return;completed=true;stickers++;try{localStorage.setItem("candyPlanetStickers",String(stickers))}catch(e){}$("stickerTotal").textContent=stickers;$("rewardTitle").textContent="太棒啦！";$("rewardText").textContent="";$("rewardSticker").textContent="🎖️ "+stickers;$("rewardScreen").querySelector(".reward-sparkle").textContent=current==="kitchen"?"🎂✨🌈":current==="garden"?"🌷🦋✨":current==="fashion"?"👑💖✨":current==="ocean"?"🐬🫧✨":current==="shapes"?"⭐🔵🔺":"🎉🌟✨";$("rewardScreen").classList.add("show");playTone(880);setTimeout(()=>playTone(1100),130);}
function removeTarget(t){worldRoot.remove(t.group);targetMeshes=targetMeshes.filter(m=>m.userData.targetId!==t.id);t.done=true;}
function handleTarget(t){if(completed||t.done)return;
if(t.type==="kitchenIngredient"){const kind=t.group.userData.ingredientKind||"strawberry";const p=t.group.position.clone();removeTarget(t);addRecipeIngredient(kind);burst(p.x,p.y,p.z,"#ffb7d9");return;}
if(t.type==="kitchenBowl"){mixRecipe();return;}
if(t.type==="oceanFish"){const p=t.group.position.clone();removeTarget(t);burst(p.x,p.y,p.z,"#ffb8d8");showWorldPop("💖");playTone(780);return;}
if(t.type==="forestMushroom"){const p=t.group.position.clone();removeTarget(t);progress++;burst(p.x,.8,p.z,"#ffadd0");showWorldPop("🦋✨");playTone(820);updateProgress();if(progress>=games[current].goal)finishGame();return;}
if(t.type==="garden"){const g=t.group;const stage=g.userData.gardenStage||"empty";if(gardenTool==="seed"&&stage==="empty"){g.userData.gardenStage="seeded";cone(g,0,.85,0,.12,.4,"#74c88e");showWorldPop("🌱");playTone(570);}else if(gardenTool==="water"&&stage==="seeded"){g.userData.gardenStage="watered";ball(g,.17,.8,.08,.08,.16,.08,"#82d9ff");showWorldPop("💧✨");playTone(650);}else if(gardenTool==="sun"&&stage==="watered"){g.userData.gardenStage="bloomed";const colors=["#ff9fca","#b5a0ff","#ffdc78"];const fl=makeFlower(worldRoot,g.position.x,.05,g.position.z,colors[progress%colors.length],1.05);fl.userData.potFlower=true;g.userData.flower=fl;showWorldPop("🌸🌼");playTone(760);}else if(gardenTool==="harvest"&&stage==="bloomed"){const p=g.position.clone();if(g.userData.flower)worldRoot.remove(g.userData.flower);removeTarget(t);progress++;burst(p.x,.8,p.z,"#b2eac7");showWorldPop("💐✨");playTone(920);updateProgress();if(progress>=games.garden.goal)finishGame();}else{showWorldPop(({seed:"🌰",water:"💧",sun:"☀️",harvest:"🧺"})[gardenTool]||"🌱");playTone(430);}return;}

if(t.type==="shape"){const p=t.group.position.clone();removeTarget(t);progress++;shapeRound++;burst(p.x,p.y,p.z,"#ffda67");playTone(740+progress*50);updateProgress();if(progress>=games[current].goal){finishGame();return;}spawnShapeRound();return;}

}
let triedOutfits=new Set();
function openGame(key){if(!games[key])return;buildWorld(key);$("gameOverlay").classList.add("is-open");document.body.classList.add("game-open");document.body.style.overflow="hidden";if(document.documentElement.requestFullscreen&&!document.fullscreenElement){const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}requestAnimationFrame(resizeScene);}
function closeGame(){if($("gameOverlay").classList.contains("is-open")){$("gameOverlay").classList.remove("is-open");document.body.classList.remove("game-open");document.body.style.overflow="";if(document.fullscreenElement&&document.exitFullscreen){const p=document.exitFullscreen();if(p&&p.catch)p.catch(()=>{});}}}
function restartCurrent(){triedOutfits.clear();buildWorld(current);requestAnimationFrame(resizeScene);}
function animate(){requestAnimationFrame(animate);if(!renderer||!scene)return;const time=clock?clock.getElapsedTime():0;if(mascot){mascot.position.y=Math.sin(time*2.2)*.06;mascot.rotation.y=Math.sin(time*.7)*.08;mascot.userData.ears[0].rotation.z=-.2+Math.sin(time*2)*.035;mascot.userData.ears[1].rotation.z=.2+Math.sin(time*2+1)*.035;}targets.forEach(t=>{if(t.done)return;if(t.type==="star"||t.type==="shape"){if(t.group.userData.baseY===undefined)t.group.userData.baseY=t.group.position.y;t.group.rotation.y=Math.sin(time*1.3+targets.indexOf(t))*.14;t.group.position.y=t.group.userData.baseY+Math.sin(time*2.2+targets.indexOf(t))*.055;}if(t.type==="bubble"){if(t.group.userData.baseY===undefined)t.group.userData.baseY=t.group.position.y;t.group.position.y=t.group.userData.baseY+Math.sin(time*1.5+targets.indexOf(t))*.12;t.group.rotation.y=Math.sin(time*.7+targets.indexOf(t))*.15;}});particles=particles.filter(p=>{p.position.x+=p.userData.vx;p.position.y+=p.userData.vy;p.position.z+=p.userData.vz;p.userData.vy-=.003;p.userData.life-=.025;p.scale.multiplyScalar(.97);if(p.userData.life<=0){worldRoot.remove(p);return false}return true});renderer.render(scene,camera);}
