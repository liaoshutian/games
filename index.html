<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16082f">
  <title>小游戏乐园</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Arial Rounded MT Bold","PingFang SC",system-ui,sans-serif;color:#fff}
    body{min-height:100dvh;background:radial-gradient(circle at 18% 12%,#7552db 0,transparent 28%),radial-gradient(circle at 86% 70%,#c44cba44 0,transparent 28%),linear-gradient(145deg,#18082f,#0b1432);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:46px 46px;mask-image:linear-gradient(#000,transparent 75%)}
    main{position:relative;width:min(1100px,calc(100% - 36px));margin:auto;padding:max(42px,env(safe-area-inset-top)) 0 72px}
    header{display:flex;align-items:center;gap:18px;margin-bottom:36px}
    .logo{width:76px;height:76px;display:grid;place-items:center;border-radius:24px;font-size:42px;background:linear-gradient(145deg,#ff91dc,#885cff);border:2px solid #ffffff88;box-shadow:0 14px 32px #09001877,inset 0 1px #fff}
    h1{margin:0;font-size:clamp(32px,6vw,54px);letter-spacing:.04em}p{margin:8px 0 0;color:#d9ccec;font-size:17px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px}
    .card{position:relative;min-height:290px;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;border-radius:34px;overflow:hidden;text-decoration:none;color:#fff;background:radial-gradient(circle at 75% 24%,#f6c2ffbb 0 4%,transparent 26%),linear-gradient(150deg,#854be6,#402080 58%,#21114f);border:2px solid #ffffff55;box-shadow:0 20px 55px #05000f88,inset 0 1px #ffffff88;transition:.25s ease}
    .card:hover,.card:focus-visible{transform:translateY(-7px);box-shadow:0 28px 70px #05000faa,0 0 0 5px #ffffff33}.card:focus-visible{outline:3px solid #fff}
    .art{position:absolute;inset:0 0 auto auto;width:70%;height:72%;display:grid;place-items:center;font-size:clamp(80px,14vw,145px);filter:drop-shadow(0 14px 12px #24064e);transform:rotate(5deg)}
    .notes{position:absolute;inset:0;pointer-events:none}.notes i{position:absolute;font-style:normal;font-size:34px;color:#ffdff8;text-shadow:0 0 16px #fff}.notes i:nth-child(1){top:17%;left:12%}.notes i:nth-child(2){top:42%;right:12%;color:#9be2ff}.notes i:nth-child(3){top:8%;right:38%;color:#ffe889}
    .tag{position:relative;width:max-content;padding:7px 13px;border-radius:999px;background:#ffffff22;border:1px solid #ffffff55;font-size:14px;margin-bottom:12px}
    h2{position:relative;margin:0;font-size:29px}.play{position:absolute;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;padding-left:4px;background:linear-gradient(145deg,#ff94dd,#b44eff);border:3px solid #ffeaff;box-shadow:0 7px 0 #4e2080;font-size:28px}
    @media(max-width:600px){main{width:min(100% - 24px,1100px);padding-top:24px}header{margin:8px 6px 28px}.logo{width:62px;height:62px;border-radius:20px;font-size:34px}.card{min-height:270px}}
  </style>
</head>
<body>
  <main>
    <header><div class="logo">🎮</div><div><h1>小游戏乐园</h1><p>选择一个游戏开始玩</p></div></header>
    <section class="grid" aria-label="游戏列表">
      <a class="card" href="./mengke/">
        <div class="notes"><i>♪</i><i>♫</i><i>★</i></div>
        <div class="art">🐰</div>
        <span class="tag">iPad · 音乐节奏</span>
        <h2>星光萌可捕捉</h2>
        <span class="play">▶</span>
      </a>
    </section>
  </main>
</body>
</html>
